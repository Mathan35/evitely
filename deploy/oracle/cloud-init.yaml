#cloud-config
# Paste into Oracle "Initialization script" when creating the Always Free ARM VM (Ubuntu 22.04).
package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - unzip
  - ufw
  - nginx
  - mysql-server
  - certbot
  - python3-certbot-nginx
  - software-properties-common
  - ca-certificates
  - gnupg
  - lsb-release

runcmd:
  - |
    set -e
    export DEBIAN_FRONTEND=noninteractive

    # PHP 8.3
    add-apt-repository -y ppa:ondrej/php
    apt-get update
    apt-get install -y php8.3-fpm php8.3-cli php8.3-mysql php8.3-mbstring php8.3-xml \
      php8.3-curl php8.3-zip php8.3-gd php8.3-bcmath php8.3-intl php8.3-opcache

    # Composer
    curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

    # Node 22
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs

    # App dirs
    mkdir -p /var/www/evitely-staging
    chown -R ubuntu:ubuntu /var/www/evitely-staging

    # MySQL staging DB
    mysql -e "CREATE DATABASE IF NOT EXISTS evitely_staging CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    mysql -e "CREATE USER IF NOT EXISTS 'evitely'@'localhost' IDENTIFIED BY 'CHANGE_ME_STAGING_DB';"
    mysql -e "GRANT ALL PRIVILEGES ON evitely_staging.* TO 'evitely'@'localhost'; FLUSH PRIVILEGES;"

    # Firewall (Oracle also needs Ingress rules in VCN)
    ufw allow OpenSSH
    ufw allow 'Nginx Full'
    ufw --force enable

    echo "Oracle staging base ready. Run deploy/oracle/deploy-staging.sh next." > /var/www/evitely-staging/READY.txt
