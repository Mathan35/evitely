# Invidora — Render FREE staging (testing only; spins down after ~15 min idle)
# Deploy: Render Dashboard → New → Blueprint → connect this repo → render.yaml
# Free Postgres expires ~30 days after creation — fine for testing.
#
# After fixing a failed Blueprint, either:
#   Dashboard → Blueprint → Sync / Manual Deploy, or push to main (auto-deploy).

services:
  - type: web
    name: invidora-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Invidora
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: INVITE_SUBDOMAINS_ENABLED
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: MAIL_MAILER
        value: log
      # Laravel 11+ reads DB_URL (not DATABASE_URL)
      - key: DB_URL
        fromDatabase:
          name: invidora-staging-db
          property: connectionString

databases:
  - name: invidora-staging-db
    plan: free
    databaseName: invidora_staging
    user: invidora
